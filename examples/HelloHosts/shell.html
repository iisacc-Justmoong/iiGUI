<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iiGUI Native Hosts</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202020}canvas{display:block;width:100vw;height:100vh;outline:none}#status{position:absolute;bottom:0;font:12px monospace;color:#ccc}</style>
<canvas id="canvas" tabindex="0" aria-label="iiGUI native C++ canvas"></canvas><div id="status">Loading compiled C++23 application…</div>
<script>
function record(line,error){const status=document.getElementById('status');status.dataset.history=(status.dataset.history||'')+line+'\n';status.textContent=line;if(error)console.error(line);else console.log(line);}
var Module={canvas:document.getElementById('canvas'),arguments:location.search.includes('self-test')?['--self-test']:[],print:function(line){record(line,false);},printErr:function(line){record(line,true);}};
Module.canvas.addEventListener('pointerdown',function(){Module.canvas.focus({preventScroll:true});});
</script>{{{ SCRIPT }}}</html>
